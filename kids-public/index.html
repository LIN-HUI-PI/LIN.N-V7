<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>NELUUN 孩童入口</title>
<link rel="icon" href="./icon-192.png">
<style>
:root{--bg:#f5f6f1;--ink:#263c37;--muted:#60736b;--green:#356c59;--pale:#e4efe8;--line:#dbe4dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 -apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}
main{max-width:520px;min-height:100dvh;margin:auto;padding:max(24px,env(safe-area-inset-top)) 20px 40px}
h1{font-size:28px;margin:24px 0 8px;text-align:center}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin:18px 0}
.muted{color:var(--muted);font-size:15px}
input{width:100%;font:700 30px/1.3 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-align:center;padding:14px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid var(--green);border-color:var(--green)}
button{font:inherit;font-weight:750;width:100%;border:0;border-radius:16px;padding:16px;margin-top:14px;background:var(--green);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{background:#fde7e7;border:1px solid #e4a3a3;color:#7a1f1f;border-radius:14px;padding:12px 14px;margin-top:14px}
.hidden{display:none!important}
.hi{font-size:56px;text-align:center}
</style></head>
<body><main>
<h1>NELUUN 孩童入口</h1>
<section id="enter" class="card">
  <p>請爸爸媽媽陪在你身邊，在「成人入口」按<b>「開始陪同」</b>，再把畫面上的 <b>8 位數代碼</b>輸入這裡。</p>
  <label for="code" class="muted">8 位數代碼</label>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="0000 0000" aria-describedby="msg">
  <div id="msg" class="err hidden" role="alert"></div>
  <button id="go" type="button">進入學習空間</button>
  <p class="muted">代碼只能用一次，10 分鐘內有效。這裡不會要你輸入姓名或信箱。</p>
</section>
<section id="welcome" class="card hidden">
  <div class="hi" id="avatar"></div>
  <p style="text-align:center;font-size:20px;font-weight:750" id="hello"></p>
  <button id="learn" type="button">開始學習</button>
  <button id="out" type="button" style="background:var(--pale);color:var(--green)">結束，離開</button>
</section>
</main>
<script>
(function(){
  var ICON={cat:'🐱',rabbit:'🐰',bear:'🐻',fox:'🦊',panda:'🐼',owl:'🦉'};
  var $=function(id){return document.getElementById(id)};
  function msg(t){var e=$('msg');e.textContent=t;e.classList.toggle('hidden',!t)}
  function welcome(d){
    $('enter').classList.add('hidden');$('welcome').classList.remove('hidden');
    $('avatar').textContent=ICON[d.avatar]||'🙂';
    $('hello').textContent=d.nickname+'，你好！';
  }
  async function post(path,body){
    var r=await fetch(path,{method:'POST',credentials:'same-origin',cache:'no-store',
      headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});
    var d;try{d=await r.json()}catch(e){d={ok:false}}
    return d;
  }
  $('code').addEventListener('input',function(e){
    var v=e.target.value.replace(/\D/g,'').slice(0,8);
    e.target.value=v.length>4?v.slice(0,4)+' '+v.slice(4):v;
  });
  $('go').onclick=async function(){
    msg('');
    var code=$('code').value.replace(/\D/g,'');
    if(code.length!==8){msg('請輸入 8 位數代碼。');return}
    $('go').disabled=true;
    try{
      var d=await post('/api/kids/enter',{code:code});
      if(d.ok){$('code').value='';welcome(d)}
      else msg(d.message||'無法進入，請爸爸媽媽再試一次。');
    }catch(e){msg('連線失敗，請稍後再試。')}
    $('go').disabled=false;
  };
  $('learn').onclick=function(){location.href='/learn'};
  $('out').onclick=async function(){try{await post('/api/kids/logout')}catch(e){}location.reload()};
  fetch('/api/kids/me',{credentials:'same-origin',cache:'no-store'})
    .then(function(r){return r.json()}).then(function(d){if(d.authenticated)welcome(d)}).catch(function(){});
})();
</script></body></html>
