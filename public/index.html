/* NELUUN V8 responsive corrections */
html,body{width:100%;max-width:100%;overflow-x:hidden}
.shell,.choice-page,.main,.mode-card,.content-panel,.question-card{min-width:0;max-width:100%}
.choice-page{padding-inline:clamp(16px,5vw,24px);overflow-x:hidden}
.choice-title,.choice-desc,.mode-card h2,.mode-card p,.main h1,.main p{overflow-wrap:anywhere}
.mode-card .inner{padding-right:96px}
.mode-card .go{display:flex;align-items:center;justify-content:center;position:absolute;right:16px;bottom:17px;border-radius:50px;min-width:72px;width:auto;height:40px;line-height:1;padding:0 14px;font-size:13px;font-weight:750;letter-spacing:.04em;white-space:nowrap}

@media(max-width:390px){.choice-title{font-size:clamp(25px,8vw,31px)}.mode-card h2{font-size:clamp(23px,7vw,29px)}.mode-card .inner{padding-left:18px;padding-right:100px}.topbar{padding-left:16px;padding-right:16px}.main{padding-left:15px;padding-right:15px}.feature-grid{gap:7px}}

function topbar(isAdult){return `<div class="topbar"><span class="topbar__brand">NELUUN ${isAdult?'<small>PERSONAL ASSISTANT</small>':'<small>學習助理</small>'}</span><span class="topbar__actions"><button type="button" data-action="choose">切換入口 ↗</button><button type="button" class="subtle-icon" data-action="${isAdult?'adultYou':'childParent'}" aria-label="${isAdult?'個人助理':'家長空間'}">${isAdult?'♙':'🐈'}</button></span></div>`}
function nav(isAdult){let links=isAdult?[['home','⌂','首頁'],['chat','◉','對話'],['tools','◇','工具'],['you','♙','我的']]:[['home','⌂','首頁'],['subjects','▦','課程'],['ask','♡','提問'],['parent','♧','家長']];let current=isAdult?s.adultView:s.childView;return `<nav class="bottom" aria-label="${isAdult?'個人助理':'學習助理'}導覽">${links.map(([id,icon,title])=>`<button type="button" data-action="view" data-target="${id}" aria-current="${current===id?'page':'false'}" class="${current===id?'active':''}"><span class="nav-icon" aria-hidden="true">${icon}</span>${title}</button>`).join('')}</nav>`}
function adultHome(){return `<div class="glow"><div class="wave" role="img" aria-label="一輪金色月環與柔和流光"></div><h1 class="adult-hero-title">留一點安靜，<br>給今天的自己。</h1><p class="adult-hero-sub">A QUIETER WAY TO THINK</p><form class="ask-form" data-form="adult"><input id="adultAsk" name="question" type="text" maxlength="260" autocomplete="off" placeholder="想聊些什麼？" aria-label="向個人助理輸入訊息"><button type="submit" aria-label="送出問題">↑</button></form><div class="suggestions"><button data-action="adultPrompt" data-prompt="幫我規劃今天">規劃今天</button><button data-action="adultPrompt" data-prompt="我想專注一件事">找回專注</button><button data-action="adultPrompt" data-prompt="幫我整理想法">整理思緒</button></div><div class="status-line"><h2 class="section-title">Make space for clarity.</h2><span class="eyebrow">EXPLORE</span></div><div class="feature-grid"><button class="feature" data-action="adultTool" data-tool="clarity"><span class="f-icon">✧</span><strong>CLARITY</strong><small>梳理想法<br>看見重點</small></button><button class="feature" data-action="adultTool" data-tool="balance"><span class="f-icon">☽</span><strong>BALANCE</strong><small>慢一點<br>重新聚焦</small></button><button class="feature" data-action="adultTool" data-tool="growth"><span class="f-icon">↗</span><strong>GROWTH</strong><small>目標拆解<br>穩穩前進</small></button></div><div class="status-line"><h2 class="section-title">Recent conversations</h2><span class="eyebrow">DEMO</span></div><div class="log-list">${s.adultConversations.length?s.adultConversations.slice().reverse().slice(0,3).map((m,i)=>`<button class="log-item" data-action="adultHistory" data-index="${s.adultConversations.length-i-1}"><span class="icon">✧</span><span><strong>${html(m)}</strong><small>此頁示範對話</small></span><span style="margin-left:auto">›</span></button>`).join(''):'<div class="log-item"><span class="icon">☾</span><span><strong>你的示範對話會出現在這裡</strong><small>不會儲存在伺服器</small></span></div>'}</div></div>`}
function demoReply(text){const t=text.toLowerCase();if(/規劃|行程|今天|時間|待辦/.test(t))return '我們先不把今天塞滿。\n\n① 選出今天最重要的一件事。\n② 為它保留一段完整、不被打斷的時間。\n③ 其餘事情按「必須／可以延後」分類。\n\n你最想先完成的是哪一件？';if(/專注|分心|焦慮|忙|壓力/.test(t))return '可以先把注意力放在一件能掌握的小事上。\n\n試著選一個 15 分鐘的小任務，把其他想法寫在旁邊，先不急著處理。\n\n你希望這 15 分鐘用來做什麼？';if(/整理|決定|選擇|想法|困惑/.test(t))return '我們可以把這件事拆成三層：\n\n・已經確定的事實\n・你目前的推測或擔心\n・真正需要你做決定的部分\n\n你想先從哪個部分開始？';return '我看見你提出的問題。這裡先提供本機規則回覆，不會連接真正的 AI 模型。\n\n正式版本預計能協助釐清問題、整理計畫與持續對話；但需要先完成安全的登入、隱私及費用機制。'}
function adultChat(){return `<h1 class="page-title" style="font-family:Georgia,serif;font-weight:500">A quiet conversation</h1><p class="muted">NELUUN · 未登入或 AI 未啟用時僅提供本機規則示範。登入且由伺服器啟用 AI 後才會傳送訊息。</p><div class="chat-screen" id="adultLog">${s.adultMessages.length?s.adultMessages.map(m=>`<div class="chat-bubble ${m.role==='user'?'me':'ai'}">${html(m.text)}<small class="chat-label">${m.role==='user'?'你':m.live?'NELUUN · AI':'NELUUN · DEMO'}</small></div>`).join(''):'<div class="content-panel"><h3>有什麼想釐清的嗎？</h3><p>可以試試「幫我規劃今天」、「我想專注一件事」，或輸入自己的問題。</p></div>'}</div><form data-form="adult" class="chat-form"><div class="ask-form"><input name="question" type="text" maxlength="260" placeholder="輸入想法或問題…" autocomplete="off" aria-label="輸入訊息"><button type="submit" aria-label="傳送訊息">↑</button></div></form><button class="linkish" data-action="clearAdult">清除目前對話</button>`}
function adultTools(){return `<h1 class="page-title" style="font-family:Georgia,serif;font-weight:500">Your space, your pace.</h1><p class="muted">這裡是工具本機版本，待辦與筆記只保存在此裝置。</p><div class="content-panel"><span class="adult-label">DAILY PRIORITIES</span><h3>今天的三個小步驟</h3><div class="tasks">${s.tasks.map((t,i)=>`<label class="task"><input type="checkbox" data-action="taskToggle" data-index="${i}" ${t.done?'checked':''}><span style="${t.done?'text-decoration:line-through;opacity:.6':''}">${html(t.text)}</span></label>`).join('')}</div><form data-form="task" style="display:flex;gap:8px;margin-top:10px"><input class="field" name="task" placeholder="增加一個小任務" maxlength="80" style="margin:0;min-width:0"><button class="outline-btn" type="submit">新增</button></form></div><div class="content-panel"><span class="adult-label">QUIET NOTES</span><h3>隨手記下一個想法</h3><form data-form="note"><textarea name="note" class="field" rows="3" maxlength="300" placeholder="寫下此刻想到的事情…" aria-label="新的備忘錄"></textarea><button class="outline-btn" type="submit">儲存筆記</button></form>${s.notes.map(n=>`<p style="border-top:1px solid #8d74474a;padding-top:9px;white-space:pre-wrap">${html(n)}</p>`).join('')}</div>`}
function accountArea(){
 const a=s.auth;
 const note=s.authMessage?`<p role="status" class="demo-alert">${html(s.authMessage)}</p>`:'';

function demoChildReply(q){if(/月亮|月相/.test(q))return '月亮會反射太陽的光。因為月亮繞地球移動，我們看到的明亮部分不一樣，所以有時圓、有時彎。你想知道新月和滿月的差別嗎？';if(/磁鐵|磁力/.test(q))return '磁鐵有 N 極和 S 極。不同磁極會互相吸引，相同磁極則會互相排斥。你想用兩塊磁鐵做個小實驗嗎？';if(/乘法|314|進位/.test(q))return '314 × 7 可以拆開算：300×7＝2100，10×7＝70，4×7＝28；最後加起來是 2198。你想試試直式嗎？';return '謝謝你的提問！這裡是本機示範，尚未連接真正的 AI，因此我無法理解所有問題。你可以試試問月亮、磁鐵或 314×7。'}
function childAsk(){return `<div class="main"><h1 class="page-title">🐈‍⬛ 問問小貓咪</h1><p class="muted">好奇沒有標準答案，慢慢問就好。</p><div class="parent-card"><strong>🔒 目前是固定題庫與示範回答</strong><p>尚未連線 AI，請不要輸入真實姓名、學校、住址或其他個人資料。</p></div><div class="child-chat-log">${s.childMessages.length?s.childMessages.map(m=>`<div class="bubble ${m.role==='user'?'me':''}">${html(m.text)}</div>`).join(''):'<div class="bubble">喵！今天想問什麼？你可以試試「為什麼月亮有時圓、有時彎？」</div>'}</div><form data-form="child" style="margin-top:16px"><textarea name="question" maxlength="160" placeholder="例如：為什麼磁鐵會吸在一起？" aria-label="輸入學習問題"></textarea><button class="pink-btn full-width-btn" style="margin-top:8px">送出問題 ↗</button></form></div>`}
function childParent(){return `<div class="main"><h1 class="page-title">家長設定與說明 ♡</h1><p class="muted">本機練習紀錄可供檢視，但此頁不是受身分驗證保護的家長儀表板。請避免在共用裝置輸入敏感資料。</p><div class="parent-card"><h3>家長與使用權限</h3><p class="access-info">訪客可免費使用本機題庫；成人免費會員可管理登入與家長聲明。進階／付費功能必須另經家長主動授權及有效訂閱，現階段尚未開放付費入口。</p><p class="access-info">法律上的家長同意與使用時的陪伴不是同一件事。這裡的「未滿 18 歲建議由家長指導與陪伴」是 NELUUN 的保護規範，不代表台灣法律一律要求父母全程在場。</p></div><div class="parent-card"><h3>本機學習進度</h3><div class="stat-row"><div class="stat"><strong>${s.completed}</strong><small>完成練習回合</small></div><div class="stat"><strong>${s.attempts}</strong><small>答題次數</small></div></div></div><div class="parent-card"><h3>最近的練習</h3><p>${(s.history||[]).length?(s.history||[]).slice(0,6).map(h=>html(h.date+"｜"+h.subject+"｜"+h.score+"/"+h.total)).join("<br>"):"尚無練習紀錄"}</p><button class="outline-btn" data-action="exportLocal">匯出本機統計</button></div>${accountArea()}${guardianArea()}<button class="outline-btn full-width-btn" data-action="clearDemo">清除本機學習紀錄</button><p class="muted">兒童 AI 和雲端同步目前固定關閉。即使已記錄自行聲明，也不代表完成監護資格查驗。</p></div>`}
function renderChild(){let view=s.childView;return `<div class="shell child-app slide-enter">${topbar(false)}<div class="child-usage-notice"><strong>未滿 18 歲：</strong>請在父母或法定代理人的適當指導與陪伴下使用。免費本機題庫不要求登入；AI 與付費服務由家長管理，現階段尚未開放。</div>${view==='home'?childHome():view==='subjects'?childSubjects():view==='quiz'?childQuiz():view==='result'?childResult():view==='ask'?childAsk():childParent()}<main class="main"><p class="demo-alert" style="margin-top:24px">🔒 本機題庫與固定示範回答；不連線 AI、不上傳學習紀錄、不產生 API 費用。</p></main>${nav(false)}</div>`}
function render(){saveLocal();app.innerHTML=s.mode==='choice'?choose():s.mode==='adult'?renderAdult():renderChild();document.body.style.backgroundColor=s.mode==='adult'?'#0f0e0d':s.mode==='child'?'#fce8ef':'#eee9e4'}
function view(target){if(s.mode==='adult'){s.adultView=target==='you'?'you':target}else if(s.mode==='child'){s.childView=target}render();window.scrollTo(0,0)}
async function serverJSON(path,payload){const response=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
 let data;try{data=await response.json()}catch{data={message:'連線失敗'}};if(!response.ok)throw Error(data.message||'操作未完成');return data;}
async function refreshAuth(){if(location.protocol!=='https:'&&location.hostname!=='localhost')return;
 try{const r=await fetch('/api/me',{cache:'no-store',credentials:'same-origin'});if(!r.ok)return;const a=await r.json();if(!a||a.ok!==true)return;s.authOnline=true;s.auth={authenticated:!!a.authenticated,email:a.email,authEnabled:!!a.authEnabled,aiEnabled:!!a.aiEnabled,guardianDeclaration:!!a.guardianDeclaration,plan:a.plan||'guest',dailyAiLimit:Number(a.dailyAiLimit)||0,dailyAiUsed:Number(a.dailyAiUsed)||0};render();}catch{s.authOnline=false;render()}}
async function sendAdult(text){const q=String(text||'').trim();if(!q||s.adultBusy)return;s.adultMessages.push({role:'user',text:q});s.adultConversations.push(q);s.adultView='chat';
 if(!(s.auth.authenticated&&s.auth.aiEnabled)){
 s.adultMessages.push({role:'assistant',live:false,text:demoReply(q)});render();window.scrollTo(0,document.body.scrollHeight);return;}
 s.adultBusy=true;s.adultMessages.push({role:'assistant',live:true,text:'正在處理…'});render();window.scrollTo(0,document.body.scrollHeight);
 try{const r=await serverJSON('/api/chat',{mode:'personal',message:q});s.adultMessages[s.adultMessages.length-1].text=r.answer||'沒有收到回覆';}
 catch(e){s.adultMessages[s.adultMessages.length-1].text='⚠️ '+e.message;}
 finally{s.adultBusy=false;await refreshAuth();render();window.scrollTo(0,document.body.scrollHeight);}}
async function requestLogin(email,rememberEmail,rememberDevice){try{s.rememberDevice=rememberDevice===true;saveRememberedEmail(email,rememberEmail===true);s.authMessage='正在寄送驗證碼…';render();await serverJSON('/api/auth/request',{email});s.loginEmail=email;s.authStage='otp';s.authMessage='請查看電子郵件。';}catch(e){s.authMessage=e.message;}render()}
async function verifyLogin(code){try{await serverJSON('/api/auth/verify',{email:s.loginEmail,code,rememberDevice:s.rememberDevice===true});s.authMessage='登入成功';s.authStage='email';await refreshAuth()}catch(e){s.authMessage=e.message}render()}
async function guardianDeclare(){try{const r=await serverJSON('/api/guardian/declare',{agree:true,confirmGuardian:true});s.auth.guardianDeclaration=!!r.guardianDeclaration;s.authMessage=r.notice||'聲明已記錄';}catch(e){s.authMessage=e.message}render()}
async function performAccountAction(type){try{const p=type==='logout'?'/api/auth/logout':'/api/guardian/withdraw';await serverJSON(p,{});if(type==='logout'){s.auth.authenticated=false;s.auth.email=null;s.auth.aiEnabled=false;s.auth.guardianDeclaration=false;s.authStage='email';s.adultMessages=[];s.adultConversations=[];s.childMessages=[];s.authMessage='已登出；此裝置本機保存的筆記與待辦不會自動清除。';}else{s.auth.guardianDeclaration=false;s.authMessage='家長自行聲明已撤回。'}await refreshAuth();}catch(e){s.authMessage=e.message}render()}
app.addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');if(!button)return;
 const a=button.dataset.action;
 switch(a){
 case 'exportLocal':downloadLocal();break;
  case 'logout':performAccountAction('logout');break;
  case 'withdrawGuardian':performAccountAction('withdraw');break;
  case 'resetLogin':s.authStage='email';s.authMessage='';render();break;
 case 'clearLocal':clearLocal();break;
 case 'mode':s.mode=button.dataset.mode;render();window.scrollTo(0,0);break;
 case 'choose':s.mode='choice';s.homeAccountOpen=false;render();window.scrollTo(0,0);break;
 case 'homeAccount':s.homeAccountOpen=true;render();break;
 case 'closeHomeAccount':s.homeAccountOpen=false;render();break;
 case 'forgetEmail':saveRememberedEmail('',false);render();break;
 case 'view':view(button.dataset.target);break;
 case 'adultYou':view('you');break;
 case 'childParent':view('parent');break;
 case 'adultPrompt':sendAdult(button.dataset.prompt);break;
 case 'adultTool':s.adultView='tools';render();window.scrollTo(0,0);break;
 case 'adultHistory':sendAdult(s.adultConversations[Number(button.dataset.index)]);break;
 case 'clearAdult':s.adultMessages=[];s.adultConversations=[];render();break;
 case 'grade':s.grade=Number(button.dataset.grade);render();break;
 case 'subject':s.quizSubject=button.dataset.id;s.questionIndex=0;s.score=0;s.showHint=false;s.answered=false;s.childView='quiz';render();window.scrollTo(0,0);break;
 case 'backSubjects':view('subjects');break;
 case 'answer':if(s.answered)return;s.answered=true;s.answerChoice=Number(button.dataset.index);s.lastWasCorrect=s.answerChoice===(bank[s.quizSubject]||bank.math)[s.questionIndex].correct;s.attempts++;if(s.lastWasCorrect)s.score++;render();break;
 case 'hint':s.showHint=true;render();break;
 case 'nextQuestion':if(s.questionIndex+1>=(bank[s.quizSubject]||bank.math).length){s.completed++;s.history.unshift({date:new Date().toLocaleDateString('zh-TW'),subject:subjects.find(t=>t.id===s.quizSubject)?.title||s.quizSubject,score:s.score,total:(bank[s.quizSubject]||bank.math).length});s.history=s.history.slice(0,60);s.childView='result'}else{s.questionIndex++;s.answered=false;s.showHint=false};render();window.scrollTo(0,0);break;
 case 'clearDemo':clearLearning();break;
 }
});
app.addEventListener('submit',event=>{const form=event.target;if(!form.dataset.form)return;event.preventDefault();const data=new FormData(form),kind=form.dataset.form;const text=String(data.get(kind==='task'?'task':kind==='note'?'note':'question')||'').trim();if(kind==='requestLogin'){const email=String(data.get('email')||'').trim();if(email)requestLogin(email,data.has('rememberEmail'),data.has('rememberDevice'));return;}if(kind==='verifyLogin'){const code=String(data.get('code')||'').trim();if(code)verifyLogin(code);return;}if(kind==='guardian'){guardianDeclare();return;}if(!text)return;
if(kind==='adult'){sendAdult(text)}else if(kind==='task'){s.tasks.push({text:text.slice(0,80),done:false});s.tasks=s.tasks.slice(-80);render()}else if(kind==='note'){s.notes.push(text.slice(0,300));s.notes=s.notes.slice(-80);render()}else if(kind==='child'){s.childMessages.push({role:'user',text:text});s.childMessages.push({role:'assistant',text:'🐈‍⬛ 小貓咪 · 本機示範：\n'+demoChildReply(text)});render();window.scrollTo(0,document.body.scrollHeight)}});
app.addEventListener('change',event=>{const el=event.target;if(el.dataset.action==='taskToggle'){const i=Number(el.dataset.index);if(s.tasks[i])s.tasks[i].done=el.checked;render()}});
render();
refreshAuth();
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
})();
</script>
