<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NELUUN｜雙入口預覽</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e8d5b4;background:#100e0d}*{box-sizing:border-box}body{margin:0}.wrap{max-width:500px;margin:auto;padding:40px 22px;min-height:100vh}h1{font-family:Georgia,serif;letter-spacing:.12em;text-align:center;font-size:38px}h2{font-size:25px}p{line-height:1.7;color:#d6c3a7}.panel{background:#241d17;border:1px solid #a88652;border-radius:22px;padding:24px;margin:24px 0}button{display:block;width:100%;padding:17px;margin:12px 0;background:#e8c58e;color:#201710;border:0;border-radius:14px;font-weight:750;font-size:17px}button.secondary{background:transparent;border:1px solid #a88652;color:#e8d5b4}.hidden{display:none}.note{font-size:13px;color:#c6b5a0}a{color:#e8c58e}button:focus-visible{outline:3px solid white;outline-offset:3px}</style></head>
<body><main class="wrap"><h1>NELUUN</h1><section id="choice"><p style="text-align:center">一個世界，兩種陪伴</p><div class="panel"><h2>成人入口</h2><p>私人助理與家長管理</p><button data-go="adult">進入成人登入</button></div><div class="panel"><h2>兒童入口</h2><p>專屬學習空間，需要父母同意與陪同</p><button data-go="kids">選擇兒童頭像</button></div></section>
<section id="adult" class="hidden"><div class="panel"><h2>成人登入</h2><p>使用現有的電子郵件驗證登入流程。</p><a href="./">開啟現有成人登入頁面</a><p class="note">此預覽不會繞過既有家長二次驗證；正式整合前需完成安全測試。</p><button class="secondary" data-go="choice">返回雙入口</button></div></section>
<section id="kids" class="hidden"><div class="panel"><h2>今天是誰要學習？</h2><button data-child="1">🐱 孩子 1</button><button data-child="2">🐰 孩子 2</button><button data-child="3">🐻 孩子 3</button><p class="note">頭像目前僅為介面預覽，尚未建立兒童帳號。</p><button class="secondary" data-go="choice">返回雙入口</button></div></section>
<section id="parent" class="hidden"><div class="panel"><h2>等待父母授權</h2><p id="child-label"></p><p>請父母先完成帳號驗證、同意及陪同確認，才可進入孩子的學習空間。</p><p class="note">安全保護：目前尚未實作父母授權 API，因此不提供繞過驗證的繼續按鈕。</p><button class="secondary" data-go="kids">返回選擇頭像</button><button class="secondary" data-go="choice">返回雙入口</button></div></section></main>
<script>const screens=['choice','adult','kids','parent'];function go(id){screens.forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));history.replaceState(null,'','#'+id)}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.child){document.getElementById('child-label').textContent='孩子 '+b.dataset.child+' 的學習空間尚未獲得父母授權。';go('parent')}});go(screens.includes(location.hash.slice(1))?location.hash.slice(1):'choice');</script></body></html>
