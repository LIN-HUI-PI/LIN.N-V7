<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NELUUN｜雙入口</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e8d5b4;background:#100e0d}*{box-sizing:border-box}body{margin:0}.wrap{max-width:500px;margin:auto;padding:40px 22px;min-height:100vh}h1{font-family:Georgia,serif;letter-spacing:.12em;text-align:center;font-size:38px}h2{font-size:25px;margin:0 0 6px}p{line-height:1.7;color:#d6c3a7}.panel{background:#241d17;border:1px solid #a88652;border-radius:22px;padding:24px;margin:24px 0}a.btn{display:block;width:100%;padding:17px;margin:12px 0;background:#e8c58e;color:#201710;border-radius:14px;font-weight:750;font-size:17px;text-align:center;text-decoration:none}a.btn.secondary{background:transparent;border:1px solid #a88652;color:#e8d5b4}.note{font-size:13px;color:#c6b5a0}a:focus-visible{outline:3px solid white;outline-offset:3px}</style></head>
<body><main class="wrap"><h1>NELUUN</h1><p style="text-align:center">一個世界，兩個獨立入口</p>
<div class="panel"><h2>成人入口</h2><p>私人助理與家長管理。孩子的帳號、陪同授權都在這裡。</p><a class="btn" href="./">成人登入</a><a class="btn secondary" href="./family.html">家長管理（孩子帳號與陪同）</a></div>
<div class="panel"><h2>兒童入口</h2><p>孩子使用另一個網址，需要父母同意與陪同，輸入家長產生的 8 位數代碼才能進入。</p><a class="btn" id="kids" href="#">前往孩童入口</a><p class="note">孩童入口和成人入口是兩個分開的網站，登入狀態互不相通。</p></div>
</main><script>(function(){var h=location.hostname,a=document.getElementById('kids');if(/\.workers\.dev$/.test(h))a.href='https://neluun-v95-kids-test.'+h.split('.').slice(1).join('.');else{a.removeAttribute('href');a.textContent='請在設定孩童網址後使用'}})();</script></body></html>
