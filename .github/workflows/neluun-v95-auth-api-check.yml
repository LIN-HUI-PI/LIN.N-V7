name: NELUUN V9.5 parent step-up API safety checks

on:
  push:
    branches:
      - neluun-v9-5-safety
    paths:
      - 'src/v95_parent_api.js'
      - 'functions/api/[[path]].js'
      - 'migrations/0002_parent_access.sql'
      - 'tests/parent_api.test.js'
      - '.github/workflows/neluun-v95-auth-api-check.yml'
      - 'wrangler.v95.test.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verify API, migration and existing V9 tests without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/v95_parent_api.js
          node --check 'functions/api/[[path]].js'
          node --check tests/parent_api.test.js
      - name: Check D1 migration in isolated in-memory SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys=ON')
          db.executescript(Path('migrations/0001_init.sql').read_text(encoding='utf-8'))
          db.executescript(Path('migrations/0002_parent_access.sql').read_text(encoding='utf-8'))
          names={row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'users','sessions','parent_challenges','parent_grants'} <= names
          print('V9.5 migration checked without any live database')
          PY
      - name: Run old V9 plus new V9.5 test suite (mock email, AI, billing)
        run: npm test
      - name: Verify production-safety defaults
        run: |
          grep -q '"AI_ENABLED": "false"' wrangler.jsonc
          grep -q 'billingEnabled: false' src/index.js
          grep -q 'childAIEnabled: false' src/index.js
          grep -q '"PARENT_STEP_UP_ENABLED": "false"' wrangler.v95.test.jsonc
      - name: No deployment is performed by this workflow
        run: echo 'PASS: only code and tests checked; no secrets or Cloudflare release'
