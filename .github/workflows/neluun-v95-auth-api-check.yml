name: NELUUN V9.5 auth API tests
on:
  push:
    branches: [neluun-v9-5-safety]
    paths:
      - src/v95_parent_api.js
      - functions/api/**
      - migrations/0002_parent_access.sql
      - tests/parent_api.test.js
      - tests/parent_client.test.js
      - public/v95_parent_client.js
      - .github/workflows/neluun-v95-auth-api-check.yml
      - wrangler.v95.test.jsonc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/v95_parent_api.js
          node --check 'functions/api/[[path]].js'
          node --check tests/parent_api.test.js
      - name: Check D1 schema using isolated in-memory SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys=ON')
          db.executescript(Path('migrations/0001_init.sql').read_text())
          db.executescript(Path('migrations/0002_parent_access.sql').read_text())
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'users', 'sessions', 'parent_challenges', 'parent_grants'} <= tables
          PY
      - name: Run original and new tests
        run: npm test
      - name: Assert all unsafe features remain off
        run: |
          grep -q '"AI_ENABLED": "false"' wrangler.jsonc
          grep -q 'billingEnabled: false' src/index.js
          grep -q 'childAIEnabled: false' src/index.js
          grep -q '"PARENT_STEP_UP_ENABLED": "false"' wrangler.v95.test.jsonc
